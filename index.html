<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baumspiel – Fressmaul &amp; Jet</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d3b1f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// ============================================================
//  Baumspiel – Fressmaul & Jet  (2 Spieler, ein Bildschirm)
//  Spieler 1: W A S D      Spieler 2: Pfeiltasten
// ============================================================

const VW = 1280, VH = 720;                 // logische Bildschirmgröße
const FONT = '"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif';
const T1 = 5;   // so viele böse Bäume -> erster Jet
const T2 = 10;  // so viele böse Bäume -> zweiter Jet

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  scale = Math.min(innerWidth / VW, innerHeight / VH);
  offX = (innerWidth - VW * scale) / 2;
  offY = (innerHeight - VH * scale) / 2;
}
addEventListener('resize', resize);
resize();

// ---------------- Hilfsfunktionen ----------------
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ellipse(x, y, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}
function circle(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function drawStar(x, y, r, color, rot = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawHeart(x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.bezierCurveTo(-10, -4, -6, -12, 0, -6);
  ctx.bezierCurveTo(6, -12, 10, -4, 0, 4);
  ctx.fill();
  ctx.restore();
}
function text(str, x, y, size, color, align = 'center', outline = '#00000088', lw = 0) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (outline) {
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw || Math.max(3, size / 6);
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

// ---------------- Sound (WebAudio, ohne Dateien) ----------------
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = 0.15, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(AC.destination);
  o.start(t0);
  o.stop(t0 + d + 0.05);
}
function noise(d, v = 0.2, freq = 900, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const len = Math.floor(AC.sampleRate * d);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource();
  src.buffer = buf;
  const flt = AC.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.setValueAtTime(freq, t0);
  flt.frequency.exponentialRampToValueAtTime(80, t0 + d);
  const g = AC.createGain();
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  src.connect(flt).connect(g).connect(AC.destination);
  src.start(t0);
}
const sfx = {
  chomp() { tone(rand(260, 340), 0.07, 'square', 0.06, 120); },
  gulp() { tone(300, 0.15, 'sine', 0.2, 700); tone(700, 0.12, 'sine', 0.12, 1200, 0.12); },
  giggle() { for (let i = 0; i < 4; i++) tone(880 + (i % 2) * 220, 0.07, 'sine', 0.07, null, i * 0.08); },
  throwMud() { tone(220, 0.12, 'triangle', 0.08, 330); },
  splat() { noise(0.25, 0.2, 500); tone(160, 0.25, 'triangle', 0.15, 60); },
  rocket() { tone(900, 0.3, 'sawtooth', 0.03, 250); noise(0.3, 0.05, 3000); },
  boom() { noise(0.6, 0.35, 1500); tone(140, 0.45, 'sine', 0.25, 40); },
  transform() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.18, 'square', 0.06, null, i * 0.12)); },
  ready() { [784, 988, 1175].forEach((f, i) => tone(f, 0.15, 'triangle', 0.12, null, i * 0.1)); },
  board() { tone(200, 0.6, 'sawtooth', 0.05, 900); noise(0.6, 0.08, 2000); },
  goal() { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.2, 'triangle', 0.13, null, i * 0.09)); },
  win() {
    const m = [523, 523, 784, 784, 880, 880, 784, 0, 698, 698, 659, 659, 587, 587, 523];
    m.forEach((f, i) => f && tone(f, 0.22, 'square', 0.06, null, i * 0.17));
    m.forEach((f, i) => f && tone(f / 2, 0.22, 'triangle', 0.08, null, i * 0.17));
  },
  start() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.12, null, i * 0.08)); },
  pop() { tone(600, 0.1, 'sine', 0.12, 1400); }
};

// ---------------- Eingabe ----------------
const keys = {};
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  initAudio();
  onKey(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
canvas.addEventListener('pointerdown', () => { initAudio(); onKey('Click'); });

// ---------------- Spielzustand ----------------
let state = 'title';     // title | play | pause | win
let level = 1;
let W = 4500, H = 1400;
let time = 0, stateT = 0;
let trees = [], decos = [], pathPts = [];
let players = [], parked = [], rockets = [], muds = [], particles = [], floats = [];
let team = 0, jetsGiven = 0;
let goal = { x: 0, y: 0, r: 105 };
let cam = { x: 0, y: 0 };
let banner = null;
let shake = 0;

function pathY(x) { return H / 2 + Math.sin(x / 430) * 190 + Math.sin(x / 170 + 1) * 40; }

function makePlayer(id) {
  const p1 = id === 1;
  return {
    id,
    name: p1 ? 'Spieler 1' : 'Spieler 2',
    color: p1 ? '#2f80ed' : '#eb3b3b',
    dark: p1 ? '#1b4f99' : '#9e1f1f',
    hair: p1 ? '#6b3e1f' : '#f2c14e',
    k: p1 ? { u: 'KeyW', d: 'KeyS', l: 'KeyA', r: 'KeyD' }
          : { u: 'ArrowUp', d: 'ArrowDown', l: 'ArrowLeft', r: 'ArrowRight' },
    x: 160, y: pathY(160) + (p1 ? -55 : 55),
    dir: { x: 1, y: 0 }, moving: false, walkT: 0,
    mode: 'foot', mouth: null, eating: null, chompT: 0,
    dizzy: 0, score: 0,
    vx: 0, vy: 0, angle: 0, alt: 0, fireCd: 0.5, done: false
  };
}

function makeLevel(n) {
  W = Math.min(4200 + n * 500, 7500);
  H = 1400;
  trees = []; decos = []; parked = []; rockets = []; muds = []; particles = []; floats = [];
  team = 0; jetsGiven = 0; banner = null;
  goal = { x: W - 260, y: pathY(W - 260), r: 105 };

  pathPts = [];
  for (let x = -40; x <= W + 40; x += 30) pathPts.push([x, pathY(x)]);

  const startX = 160, startY = pathY(160);
  const free = (x, y, d) => !trees.some(t => dist(t.x, t.y, x, y) < d);
  const awayFromSpecial = (x, y, d1, d2) =>
    dist(x, y, startX, startY) > d1 && dist(x, y, goal.x, goal.y) > d2;

  // böse Bäume – gleichmäßig über den Wald verteilt
  const E = 18 + (n - 1) * 3;
  for (let i = 0; i < E; i++) {
    for (let tries = 0; tries < 40; tries++) {
      const x = 450 + (i + rand(0.1, 0.9)) * (W - 950) / E;
      const y = rand(170, H - 90);
      if (free(x, y, 120) && awayFromSpecial(x, y, 300, 300)) {
        trees.push(makeTree(x, y, true));
        break;
      }
    }
  }
  // liebe Bäume
  const N = Math.floor(W / 62);
  for (let i = 0; i < N; i++) {
    for (let tries = 0; tries < 20; tries++) {
      const x = rand(60, W - 60), y = rand(150, H - 40);
      if (Math.abs(y - pathY(x)) < 50) continue;
      if (free(x, y, 108) && awayFromSpecial(x, y, 220, 230)) {
        trees.push(makeTree(x, y, false));
        break;
      }
    }
  }
  // Deko: Blumen, Gras, Steine, Pilze
  const flowerCols = ['#ff6fa8', '#ffe14d', '#ffffff', '#b884ff', '#ff8a3d', '#6ec6ff'];
  for (let i = 0; i < W / 6; i++) {
    decos.push({
      x: rand(0, W), y: rand(0, H), type: Math.floor(rand(0, 10)),
      c: flowerCols[Math.floor(rand(0, flowerCols.length))], s: rand(0.7, 1.3)
    });
  }
  players = [makePlayer(1), makePlayer(2)];
  for (const p of players) p.mouth = { x: p.x + 30, y: p.y - 20, state: 'normal', t: 0 };
  updateCamera();
}

function makeTree(x, y, evil) {
  return {
    x, y, evil, size: evil ? rand(0.95, 1.15) : rand(0.85, 1.3),
    phase: rand(0, 10), alive: true, eater: null, eatT: 0, targeted: false,
    happy: 0, cool: 0, mudCd: rand(2.5, 6), throwT: 0,
    shade: Math.floor(rand(0, 3)), fruit: !evil && Math.random() < 0.25
  };
}

// ---------------- Effekte ----------------
function burst(x, y, n, colors, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(opts.min || 60, opts.max || 260);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opts.up || 0),
      life: rand(0.5, 1.1) * (opts.life || 1), max: 1, g: opts.g ?? 300,
      c: colors[Math.floor(rand(0, colors.length))], s: rand(3, 7) * (opts.size || 1),
      type: opts.type || 'dot', rot: rand(0, 6)
    });
    particles[particles.length - 1].max = particles[particles.length - 1].life;
  }
}
function floatText(x, y, str, color, size = 34) { floats.push({ x, y, str, color, size, life: 1.3 }); }
function showBanner(str, color = '#fff', dur = 3) { banner = { str, color, life: dur, max: dur }; }

// ---------------- Spiel starten ----------------
function startGame(n) {
  level = n;
  makeLevel(n);
  state = 'play';
  stateT = 0;
  sfx.start();
  showBanner('Friss die bösen Bäume mit deinem Fressmaul!', '#ffe14d', 4.5);
}

function onKey(code) {
  if (code === 'KeyM') { muted = !muted; return; }
  if (state === 'title') {
    if (code === 'Space' || code === 'Enter' || code === 'Click') startGame(1);
  } else if (state === 'play') {
    if (code === 'Escape' || code === 'KeyP') { state = 'pause'; }
  } else if (state === 'pause') {
    if (code === 'Space' || code === 'Enter' || code === 'Escape' || code === 'KeyP' || code === 'Click') state = 'play';
  } else if (state === 'win') {
    if (stateT > 1.5 && (code === 'Space' || code === 'Enter' || code === 'Click')) startGame(level + 1);
  }
}

// ---------------- Update ----------------
function inputOf(p) {
  let ix = (keys[p.k.r] ? 1 : 0) - (keys[p.k.l] ? 1 : 0);
  let iy = (keys[p.k.d] ? 1 : 0) - (keys[p.k.u] ? 1 : 0);
  const l = Math.hypot(ix, iy);
  if (l) { ix /= l; iy /= l; }
  return [ix, iy, l > 0];
}

function onScreen(x, y, m = 0) {
  return x > cam.x - m && x < cam.x + VW + m && y > cam.y - m && y < cam.y + VH + m;
}

function updateFoot(p, dt) {
  const [ix, iy, mv] = inputOf(p);
  p.moving = mv;
  if (mv) { p.dir = { x: ix, y: iy }; p.walkT += dt * 11; }
  const sp = 215 * (p.dizzy > 0 ? 0.45 : 1);
  p.x += ix * sp * dt;
  p.y += iy * sp * dt;
  // Zusammenstoß mit Bäumen
  for (const t of trees) {
    if (!t.alive || t.eater) continue;
    const r = 20 * t.size + 14;
    const d = dist(p.x, p.y, t.x, t.y);
    if (d < r && d > 0.01) {
      p.x = t.x + (p.x - t.x) / d * r;
      p.y = t.y + (p.y - t.y) / d * r;
    }
    // liebe Bäume kichern, wenn man sie besucht
    if (!t.evil && d < r + 18 && t.cool <= 0) {
      t.happy = 1.2; t.cool = 3;
      floatText(t.x, t.y - 140 * t.size, 'Hihi!', '#ff8fc8', 28);
      for (let i = 0; i < 4; i++) burst(t.x, t.y - 90 * t.size, 1, ['#ff5fa2'], { type: 'heart', g: -40, min: 20, max: 70, size: 1.6 });
      sfx.giggle();
    }
  }
  // Einsteigen in den eigenen Jet
  for (let i = parked.length - 1; i >= 0; i--) {
    const j = parked[i];
    if (j.owner === p && j.t > 0.6 && dist(p.x, p.y, j.x, j.y) < 55) {
      parked.splice(i, 1);
      p.mode = 'jet'; p.alt = 0; p.x = j.x; p.y = j.y; p.angle = 0; p.vx = 0; p.vy = 0;
      p.fireCd = 1;
      sfx.board();
      burst(p.x, p.y, 25, ['#ffffff', '#cfe8ff', p.color], { g: 0 });
      showBanner(`${p.name} fliegt! Die Raketen schießen von allein!`, p.color === '#2f80ed' ? '#8fc4ff' : '#ff9a9a', 4);
    }
  }
}

function updateMouth(p, dt) {
  const m = p.mouth;
  if (!m) return;
  m.t += dt;
  let tx = p.x + p.dir.x * 32, ty = p.y - 22 + p.dir.y * 18;

  if (m.state === 'transform') {
    tx = p.x + 60; ty = p.y - 30;
    if (Math.random() < 0.6) burst(m.x, m.y, 1, ['#fff59d', '#ffffff', '#80deea'], { g: 0, min: 30, max: 120, type: 'star' });
    if (m.t > 1.9) {
      parked.push({ x: m.x, y: m.y + 25, owner: p, t: 0 });
      p.mouth = null;
      burst(m.x, m.y, 40, ['#ffffff', '#fff59d', p.color], { g: 0, type: 'star', max: 320 });
      sfx.ready();
      showBanner(`${p.name}: Lauf zu deinem Jet und steig ein!`, '#ffe14d', 4);
      return;
    }
  } else if (p.eating) {
    const t = p.eating;
    t.eatT += dt / 0.75;
    tx = t.x; ty = t.y - 45 * t.size * (1 - t.eatT);
    p.chompT -= dt;
    if (p.chompT <= 0) {
      p.chompT = 0.14; sfx.chomp();
      burst(t.x, t.y - 50 * t.size * (1 - t.eatT), 3, ['#4b2d63', '#6e4a8a', '#5b3a29'], { g: 400, max: 160 });
    }
    if (t.eatT >= 1) {
      t.alive = false;
      p.eating = null;
      sfx.gulp();
      killTree(t, p, 'eat');
    }
  } else if (m.state === 'normal' && p.dizzy <= 0) {
    // Nahe am bösen Baum? -> Mampfen!
    let best = null, bd = 1e9;
    for (const t of trees) {
      if (!t.alive || !t.evil || t.eater) continue;
      const d = dist(p.x, p.y, t.x, t.y);
      if (d < 20 * t.size + 48 && d < bd) { bd = d; best = t; }
    }
    if (best) { p.eating = best; best.eater = p; best.eatT = 0; p.chompT = 0; }
  }
  const k = Math.min(1, dt * 10);
  m.x += (tx - m.x) * k;
  m.y += (ty - m.y) * k;
}

function killTree(t, p, how) {
  team++;
  p.score++;
  const cx = t.x, cy = t.y - 60 * t.size;
  burst(cx, cy, 22, ['#4b2d63', '#7b4f9d', '#5b3a29', '#2e7d32'], { up: 120 });
  burst(cx, cy, 8, ['#ffe14d', '#ffffff'], { type: 'star', g: 0 });
  floatText(cx, cy - 40, how === 'eat' ? 'Mampf!' : 'BUMM!', how === 'eat' ? '#ffe14d' : '#ffb347', 40);
  // An der Stelle wächst ein lieber kleiner Baum (Setzling)
  decos.push({ x: t.x, y: t.y, type: 99, c: '#4caf50', s: 1 });

  if (jetsGiven === 0 && team >= T1) {
    const q = (p.mouth && p.mouth.state === 'normal') ? p : players.find(o => o.mouth && o.mouth.state === 'normal');
    if (q) giveJet(q);
  } else if (jetsGiven === 1 && team >= T2) {
    const q = players.find(o => o.mouth && o.mouth.state === 'normal');
    if (q) giveJet(q);
  }
}

function giveJet(p) {
  jetsGiven++;
  if (p.eating) { p.eating.eater = null; p.eating.eatT = 0; p.eating = null; }
  p.mouth.state = 'transform';
  p.mouth.t = 0;
  sfx.transform();
  showBanner(`Wow! ${p.name}s Fressmaul verwandelt sich in einen JET!`, '#ffffff', 3.5);
}

function updateJet(p, dt) {
  const [ix, iy, mv] = inputOf(p);
  p.moving = mv;
  p.alt = Math.min(1, p.alt + dt * 1.4);
  const sp = 340;
  const k = Math.min(1, dt * 4);
  p.vx += (ix * sp - p.vx) * k;
  p.vy += (iy * sp - p.vy) * k;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (Math.hypot(p.vx, p.vy) > 25) p.angle = lerpAngle(p.angle, Math.atan2(p.vy, p.vx), Math.min(1, dt * 8));
  if (Math.random() < 0.5) particles.push({ x: p.x - Math.cos(p.angle) * 40, y: p.y - Math.sin(p.angle) * 40, vx: 0, vy: 0, life: 0.5, max: 0.5, g: -20, c: '#ffffffaa', s: 5, type: 'dot' });

  // Raketen automatisch auf den nächsten bösen Baum
  p.fireCd -= dt;
  if (p.fireCd <= 0 && p.alt >= 1) {
    let best = null, bd = 470;
    for (const t of trees) {
      if (!t.alive || !t.evil || t.eater || t.targeted) continue;
      if (!onScreen(t.x, t.y, -10)) continue;
      const d = dist(p.x, p.y, t.x, t.y);
      if (d < bd) { bd = d; best = t; }
    }
    if (best) {
      best.targeted = true;
      rockets.push({ x: p.x, y: p.y, vx: Math.cos(p.angle) * 250, vy: Math.sin(p.angle) * 250, target: best, owner: p, life: 3.5 });
      p.fireCd = 0.75;
      sfx.rocket();
    } else p.fireCd = 0.15;
  }
  // Ziel
  if (!p.done && dist(p.x, p.y, goal.x, goal.y) < goal.r) {
    p.done = true;
    sfx.goal();
    burst(goal.x, goal.y, 50, ['#ff5252', '#ffeb3b', '#4caf50', '#2196f3', '#9c27b0', '#ffffff'], { g: 0, type: 'star', max: 380 });
    floatText(goal.x, goal.y - 150, `${p.name} ist im Ziel!`, '#ffffff', 36);
    const other = players.find(o => o !== p);
    if (!other.done) showBanner(other.mode === 'jet' ? `Super! Jetzt noch ${other.name}!` : `Super! ${other.name} braucht noch einen Jet!`, '#ffe14d', 4);
  }
}

function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.life -= dt;
    const t = r.target;
    const tx = t.x, ty = t.y - 55 * t.size;
    const d = dist(r.x, r.y, tx, ty);
    const sp = 560;
    const k = Math.min(1, dt * 7);
    r.vx += ((tx - r.x) / (d || 1) * sp - r.vx) * k;
    r.vy += ((ty - r.y) / (d || 1) * sp - r.vy) * k;
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    particles.push({ x: r.x, y: r.y, vx: rand(-20, 20), vy: rand(-20, 20), life: 0.4, max: 0.4, g: 0, c: Math.random() < 0.5 ? '#ffb300' : '#dddddd', s: 4, type: 'dot' });
    if (d < 22 || r.life <= 0 || !t.alive) {
      rockets.splice(i, 1);
      t.targeted = false;
      sfx.boom();
      shake = 0.25;
      burst(r.x, r.y, 26, ['#ff9800', '#ffeb3b', '#ff5722', '#ffffff'], { g: 60, max: 300 });
      if (t.alive && !t.eater && d < 40) { t.alive = false; killTree(t, r.owner, 'rocket'); }
    }
  }
}

function updateMud(dt) {
  // böse Bäume werfen manchmal langsame Matschkugeln
  for (const t of trees) {
    if (!t.alive || !t.evil || t.eater) continue;
    t.throwT = Math.max(0, t.throwT - dt);
    t.mudCd -= dt;
    if (t.mudCd > 0) continue;
    t.mudCd = rand(3.5, 6.5) / (1 + (level - 1) * 0.12);
    if (!onScreen(t.x, t.y, -40)) continue;
    let target = null, bd = 360;
    for (const p of players) {
      if (p.mode !== 'foot') continue;
      const d = dist(p.x, p.y, t.x, t.y);
      if (d < bd) { bd = d; target = p; }
    }
    if (!target) continue;
    const sx = t.x, sy = t.y - 70 * t.size;
    const a = Math.atan2(target.y - 20 - sy, target.x - sx);
    const sp = 140 + level * 10;
    muds.push({ x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 3.2 });
    t.throwT = 0.5;
    sfx.throwMud();
  }
  for (let i = muds.length - 1; i >= 0; i--) {
    const m = muds[i];
    m.life -= dt;
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    let hit = false;
    for (const p of players) {
      if (p.mode === 'foot' && p.dizzy <= 0 && dist(m.x, m.y, p.x, p.y - 22) < 22) {
        p.dizzy = 1.4;
        hit = true;
        floatText(p.x, p.y - 90, 'Igitt!', '#c28a5a', 30);
      }
    }
    if (hit || m.life <= 0) {
      muds.splice(i, 1);
      burst(m.x, m.y, 12, ['#6d4c2f', '#8d6e4f', '#4e342e'], { g: 300, max: 150 });
      if (hit) sfx.splat();
    }
  }
}

function updateCamera() {
  const mx = (players[0].x + players[1].x) / 2;
  const my = (players[0].y + players[1].y) / 2;
  cam.x = clamp(mx - VW / 2, 0, W - VW);
  cam.y = clamp(my - VH / 2, 0, H - VH);
  for (const p of players) {
    p.x = clamp(p.x, Math.max(25, cam.x + 30), Math.min(W - 25, cam.x + VW - 30));
    p.y = clamp(p.y, Math.max(60, cam.y + (p.mode === 'jet' ? 110 : 120)), Math.min(H - 15, cam.y + VH - 20));
  }
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.vy += q.g * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.rot += dt * 4;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].life -= dt;
    floats[i].y -= 45 * dt;
    if (floats[i].life <= 0) floats.splice(i, 1);
  }
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  shake = Math.max(0, shake - dt);
}

function update(dt) {
  for (const t of trees) {
    t.happy = Math.max(0, t.happy - dt);
    t.cool = Math.max(0, t.cool - dt);
  }
  for (const p of players) {
    p.dizzy = Math.max(0, p.dizzy - dt);
    if (p.mode === 'foot') { updateFoot(p, dt); updateMouth(p, dt); }
    else updateJet(p, dt);
  }
  for (const j of parked) j.t += dt;
  updateRockets(dt);
  updateMud(dt);
  updateCamera();

  // Sicherheitsnetz: es gibt immer genug böse Bäume
  const left = trees.filter(t => t.alive && t.evil).length;
  if (team + left < T2 + 2) {
    for (let tries = 0; tries < 30; tries++) {
      const x = rand(300, W - 400), y = rand(170, H - 90);
      if (!onScreen(x, y, 100) && !trees.some(t => t.alive && dist(t.x, t.y, x, y) < 110)) { trees.push(makeTree(x, y, true)); break; }
    }
  }

  if (players.every(p => p.done)) {
    state = 'win';
    stateT = 0;
    sfx.win();
    banner = null;
  }
}

function updateWin(dt) {
  for (const p of players) {
    // Jets kreisen fröhlich ums Ziel
    const a = time * 1.2 + (p.id === 1 ? 0 : Math.PI);
    const tx = goal.x + Math.cos(a) * 170, ty = goal.y + Math.sin(a) * 110;
    p.vx = (tx - p.x) * 2; p.vy = (ty - p.y) * 2;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (Math.hypot(p.vx, p.vy) > 10) p.angle = lerpAngle(p.angle, Math.atan2(p.vy, p.vx), Math.min(1, dt * 6));
  }
  cam.x = clamp(goal.x - VW / 2, 0, W - VW);
  cam.y = clamp(goal.y - VH / 2, 0, H - VH);
  if (Math.random() < dt * 3) {
    const fx = cam.x + rand(150, VW - 150), fy = cam.y + rand(100, 350);
    burst(fx, fy, 40, [['#ff5252', '#ffeb3b'], ['#40c4ff', '#ffffff'], ['#b388ff', '#ff80ab'], ['#69f0ae', '#ffff8d']][Math.floor(rand(0, 4))], { g: 80, max: 260, type: 'star' });
    tone(rand(500, 900), 0.3, 'sine', 0.04, 200);
  }
}

// ---------------- Zeichnen ----------------
function drawGround() {
  ctx.fillStyle = '#7cc35a';
  ctx.fillRect(cam.x - 50, cam.y - 50, VW + 100, VH + 100);
  // Weg
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (const [x, y] of pathPts) ctx.lineTo(x, y);
  ctx.strokeStyle = '#d9bf85';
  ctx.lineWidth = 78;
  ctx.stroke();
  ctx.strokeStyle = '#e8d29e';
  ctx.lineWidth = 58;
  ctx.stroke();

  for (const d of decos) {
    if (!onScreen(d.x, d.y, 30)) continue;
    const s = d.s;
    if (d.type === 99) { // Setzling, wo ein böser Baum war
      ellipse(d.x, d.y, 10, 4, 'rgba(0,0,0,.15)');
      ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y - 14); ctx.stroke();
      ellipse(d.x - 6, d.y - 15, 7, 4, '#66bb6a');
      ellipse(d.x + 6, d.y - 17, 7, 4, '#81c784');
    } else if (d.type <= 3) { // Blume
      for (let i = 0; i < 5; i++) {
        const a = i * Math.PI * 2 / 5;
        circle(d.x + Math.cos(a) * 4 * s, d.y + Math.sin(a) * 4 * s, 3.2 * s, d.c);
      }
      circle(d.x, d.y, 2.5 * s, '#ffcf33');
    } else if (d.type <= 7) { // Grasbüschel
      ctx.strokeStyle = '#5ea844';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i = -1; i <= 1; i++) { ctx.moveTo(d.x + i * 4, d.y); ctx.lineTo(d.x + i * 7 * s, d.y - 10 * s); }
      ctx.stroke();
    } else if (d.type === 8) { // Stein
      ellipse(d.x, d.y, 9 * s, 6 * s, '#9e9e9e');
      ellipse(d.x - 2, d.y - 2, 5 * s, 3 * s, '#bdbdbd');
    } else { // Pilz
      ctx.fillStyle = '#fff3e0';
      ctx.fillRect(d.x - 2.5 * s, d.y - 8 * s, 5 * s, 8 * s);
      ctx.fillStyle = '#e53935';
      ctx.beginPath(); ctx.arc(d.x, d.y - 8 * s, 8 * s, Math.PI, 0); ctx.fill();
      circle(d.x - 3 * s, d.y - 11 * s, 1.5 * s, '#fff');
      circle(d.x + 3 * s, d.y - 10 * s, 1.5 * s, '#fff');
    }
  }
}

function drawNiceTree(t) {
  const s = t.size;
  const bounce = t.happy > 0 ? Math.abs(Math.sin(t.happy * 12)) * 8 : 0;
  const sway = Math.sin(time * 1.3 + t.phase) * 2;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.scale(s, s);
  ellipse(0, 0, 34, 11, 'rgba(0,0,0,.2)');
  ctx.fillStyle = '#8d5a33';
  rr(-11, -52, 22, 54, 6); ctx.fill();
  ctx.fillStyle = '#a56b3f';
  rr(-6, -50, 6, 48, 3); ctx.fill();
  ctx.translate(sway, -bounce);
  const greens = [['#3fa34d', '#56c264'], ['#2e9a50', '#49b866'], ['#5bb83a', '#78d057']][t.shade];
  for (const [cx, cy, r] of [[-30, -64, 30], [30, -64, 30], [0, -112, 33], [0, -80, 44]]) circle(cx, cy, r, greens[0]);
  for (const [cx, cy, r] of [[-34, -70, 18], [-8, -118, 18], [22, -96, 16]]) circle(cx, cy, r, greens[1]);
  if (t.fruit) for (const [cx, cy] of [[-38, -55], [35, -70], [12, -125], [-20, -100]]) { circle(cx, cy, 6, '#e53935'); circle(cx - 2, cy - 2, 2, '#ffcdd2'); }
  // Gesicht
  const blink = (Math.sin(time * 0.9 + t.phase * 3) > 0.985);
  if (blink) {
    ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-17, -82); ctx.lineTo(-7, -82); ctx.moveTo(7, -82); ctx.lineTo(17, -82); ctx.stroke();
  } else {
    circle(-12, -82, 6, '#1b1b1b'); circle(12, -82, 6, '#1b1b1b');
    circle(-10, -84, 2.2, '#fff'); circle(14, -84, 2.2, '#fff');
  }
  circle(-22, -70, 6, 'rgba(255,120,150,.55)');
  circle(22, -70, 6, 'rgba(255,120,150,.55)');
  ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  if (t.happy > 0) { ctx.fillStyle = '#7a1f2b'; ctx.arc(0, -70, 9, 0, Math.PI); ctx.fill(); }
  else ctx.arc(0, -72, 8, 0.2, Math.PI - 0.2);
  ctx.stroke();
  ctx.restore();
}

function drawEvilTree(t) {
  let s = t.size, x = t.x, y = t.y;
  if (t.eater) {
    s *= Math.max(0.05, 1 - t.eatT);
    x += rand(-4, 4);
  }
  const wave = Math.sin(time * 3 + t.phase);
  const raise = t.throwT > 0 ? -18 : 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ellipse(0, 0, 36, 12, 'rgba(0,0,0,.25)');
  // Wurzeln
  ctx.strokeStyle = '#4a2f22'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, -4); ctx.lineTo(-24, 4);
  ctx.moveTo(8, -4); ctx.lineTo(24, 4);
  ctx.stroke();
  // Stamm
  ctx.fillStyle = '#5b3a29';
  ctx.beginPath();
  ctx.moveTo(-14, 0); ctx.quadraticCurveTo(-4, -30, -11, -60); ctx.lineTo(11, -60); ctx.quadraticCurveTo(4, -30, 14, 0);
  ctx.closePath(); ctx.fill();
  // Ast-Arme
  ctx.strokeStyle = '#4a2f22'; ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(-6, -40); ctx.lineTo(-38, -52 + wave * 6 + raise);
  ctx.moveTo(6, -40); ctx.lineTo(38, -52 - wave * 6 + raise);
  ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (const sx of [-1, 1]) {
    const hx = 38 * sx, hy = -52 - sx * wave * 6 + raise;
    ctx.moveTo(hx, hy); ctx.lineTo(hx + 8 * sx, hy - 8);
    ctx.moveTo(hx, hy); ctx.lineTo(hx + 10 * sx, hy + 2);
    ctx.moveTo(hx, hy); ctx.lineTo(hx + 3 * sx, hy - 11);
  }
  ctx.stroke();
  // stachelige Krone
  ctx.translate(Math.sin(time * 7 + t.phase) * 1.5, 0);
  ctx.fillStyle = '#3e2453';
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const a = i * Math.PI / 8 + Math.sin(time * 2 + t.phase) * 0.05;
    const r = i % 2 ? 40 : 56;
    ctx.lineTo(Math.cos(a) * r, -92 + Math.sin(a) * r * 0.9);
  }
  ctx.closePath(); ctx.fill();
  circle(0, -92, 36, '#55306f');
  circle(-14, -108, 12, '#64407e');
  // böses Gesicht
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath(); ctx.ellipse(-13, -94, 9, 7, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -94, 9, 7, -0.3, 0, Math.PI * 2); ctx.fill();
  circle(-12, -93, 3.5, '#d50000'); circle(12, -93, 3.5, '#d50000');
  ctx.strokeStyle = '#140b1c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-24, -108); ctx.lineTo(-5, -100); ctx.moveTo(24, -108); ctx.lineTo(5, -100); ctx.stroke();
  // Zackenmund
  ctx.fillStyle = '#1a0d22';
  ctx.beginPath(); ctx.ellipse(0, -74, 15, t.throwT > 0 ? 10 : 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  for (let i = -2; i <= 1; i++) { ctx.moveTo(i * 7, -79); ctx.lineTo(i * 7 + 7, -79); ctx.lineTo(i * 7 + 3.5, -73); }
  ctx.fill();
  ctx.restore();
}

function drawPerson(p) {
  const x = p.x, y = p.y;
  const sw = p.moving ? Math.sin(p.walkT) * 6 : 0;
  ellipse(x, y, 15, 5, 'rgba(0,0,0,.25)');
  // Beine
  ctx.strokeStyle = '#34495e'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 18); ctx.lineTo(x - 5 + sw, y - 4);
  ctx.moveTo(x + 5, y - 18); ctx.lineTo(x + 5 - sw, y - 4);
  ctx.stroke();
  ellipse(x - 5 + sw, y - 2, 5, 3, '#2b2b2b');
  ellipse(x + 5 - sw, y - 2, 5, 3, '#2b2b2b');
  // Arme
  ctx.strokeStyle = '#ffd2a6'; ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x - 11, y - 34); ctx.lineTo(x - 17 - sw * 0.6, y - 21);
  ctx.moveTo(x + 11, y - 34); ctx.lineTo(x + 17 + sw * 0.6, y - 21);
  ctx.stroke();
  // Körper
  ctx.fillStyle = p.color; rr(x - 12, y - 40, 24, 24, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = `bold 14px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(p.id), x, y - 28);
  // Kopf
  const hy = y - 53 + (p.moving ? Math.abs(Math.sin(p.walkT)) * -2 : 0);
  circle(x, hy, 14, '#ffd9b3');
  // Haare / Mütze
  ctx.fillStyle = p.id === 1 ? p.color : p.hair;
  ctx.beginPath(); ctx.arc(x, hy - 2, 14.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  if (p.id === 1) { ctx.fillStyle = p.dark; ctx.fillRect(x + (p.dir.x < 0 ? -22 : 2), hy - 7, 20, 5); }
  else { circle(x - 13, hy + 2, 5, p.hair); circle(x + 13, hy + 2, 5, p.hair); }
  // Gesicht
  const ex = p.dir.x * 3, ey = p.dir.y * 2;
  if (p.dizzy > 0) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    for (const sx of [-5, 5]) { ctx.beginPath(); ctx.arc(x + sx, hy, 3, time * 10, time * 10 + 5); ctx.stroke(); }
  } else {
    circle(x - 5 + ex, hy + ey, 2.4, '#222');
    circle(x + 5 + ex, hy + ey, 2.4, '#222');
  }
  ctx.strokeStyle = '#a0522d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x + ex, hy + 5 + ey, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  // Schwindelsterne
  if (p.dizzy > 0) for (let i = 0; i < 3; i++) {
    const a = time * 5 + i * 2.1;
    drawStar(x + Math.cos(a) * 18, hy - 18 + Math.sin(a) * 5, 6, '#ffeb3b', a);
  }
  // Nummernschild über dem Kopf
  ctx.fillStyle = '#fff'; ctx.strokeStyle = p.color; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y - 88, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  text(String(p.id), x, y - 87, 16, p.color, 'center', null);
}

function drawMouth(p) {
  const m = p.mouth;
  if (!m) return;
  const eating = !!p.eating;
  const tr = m.state === 'transform';
  ctx.save();
  ctx.translate(m.x, m.y + Math.sin(time * 5 + p.id) * 3);
  if (tr) {
    const g = m.t / 1.9;
    ctx.globalAlpha = 0.5;
    circle(0, 0, 30 + g * 40 + Math.sin(time * 20) * 5, '#fff59d');
    ctx.globalAlpha = 1;
    ctx.rotate(g * g * 25);
    ctx.scale(1 + g * 1.2, 1 + g * 1.2);
  }
  if (p.dir.x < 0 && !tr) ctx.scale(-1, 1);
  // kleine Flügel
  const flap = Math.sin(time * 18) * 4;
  ellipse(-14, -8 - flap, 8, 5, '#ffffffcc');
  ellipse(14, -8 + flap, 8, 5, '#ffffffcc');
  // Körper
  circle(0, 0, 17, '#ffd23f');
  ctx.strokeStyle = '#c99400'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.stroke();
  // Maul
  const open = eating ? 0.5 + 0.5 * Math.sin(time * 28) : 0.35 + 0.2 * Math.sin(time * 3 + p.id);
  const oh = 2 + open * 10;
  ctx.fillStyle = '#b3123b';
  ctx.beginPath(); ctx.ellipse(5, 5, 10, oh, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const tx = -3 + i * 4.5;
    ctx.moveTo(tx, 5 - oh); ctx.lineTo(tx + 4, 5 - oh); ctx.lineTo(tx + 2, 5 - oh + 4);
    ctx.moveTo(tx, 5 + oh); ctx.lineTo(tx + 4, 5 + oh); ctx.lineTo(tx + 2, 5 + oh - 4);
  }
  ctx.fill();
  // Augen
  circle(-3, -8, 5.5, '#fff'); circle(9, -8, 5.5, '#fff');
  circle(-1, -8, 2.6, '#222'); circle(11, -8, 2.6, '#222');
  ctx.restore();
}

function drawJet(x, y, ang, p, sc, flame) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(sc, sc);
  if (flame) {
    const fl = rand(10, 22);
    ctx.fillStyle = '#ff9800';
    ctx.beginPath(); ctx.moveTo(-40, -8); ctx.lineTo(-52 - fl, 0); ctx.lineTo(-40, 8); ctx.fill();
    ctx.fillStyle = '#fff59d';
    ctx.beginPath(); ctx.moveTo(-40, -4); ctx.lineTo(-46 - fl * 0.6, 0); ctx.lineTo(-40, 4); ctx.fill();
  }
  // Flügel
  ctx.fillStyle = p.dark;
  for (const sy of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(10, 7 * sy); ctx.lineTo(-16, 44 * sy); ctx.lineTo(-30, 44 * sy); ctx.lineTo(-18, 7 * sy);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-28, 5 * sy); ctx.lineTo(-42, 20 * sy); ctx.lineTo(-48, 20 * sy); ctx.lineTo(-42, 5 * sy);
    ctx.closePath(); ctx.fill();
  }
  // Rumpf
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.moveTo(52, 0);
  ctx.quadraticCurveTo(34, -14, -20, -12);
  ctx.lineTo(-42, -8); ctx.lineTo(-42, 8); ctx.lineTo(-20, 12);
  ctx.quadraticCurveTo(34, 14, 52, 0);
  ctx.fill();
  ctx.strokeStyle = p.dark; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#ffffffcc';
  ctx.fillRect(-36, -2.5, 46, 5);
  // Stern auf den Flügeln
  drawStar(-18, -30, 6, '#ffeb3b');
  drawStar(-18, 30, 6, '#ffeb3b');
  // Cockpit + Pilot
  ellipse(16, 0, 15, 9, '#bfe9ff');
  circle(12, 0, 6, '#ffd9b3');
  ctx.fillStyle = p.id === 1 ? p.color : p.hair;
  ctx.beginPath(); ctx.arc(12, 0, 6.5, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
  ellipse(21, -3, 4, 2, '#ffffffaa');
  circle(52, 0, 3, '#ffffff');
  ctx.restore();
}

function drawGoalGround() {
  ellipse(goal.x + 30, goal.y + 70, goal.r + 30, 30, 'rgba(0,0,0,.15)');
  // Zielflaggen links/rechts
  for (const sx of [-1, 1]) {
    const fx = goal.x + sx * (goal.r + 50), fy = goal.y + 60;
    ctx.strokeStyle = '#555'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 120); ctx.stroke();
    const wv = Math.sin(time * 4 + sx) * 4;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
      ctx.fillStyle = (i + j) % 2 ? '#111' : '#fff';
      ctx.fillRect(fx + i * 12, fy - 120 + j * 12 + wv * (i / 4), 12, 12);
    }
  }
}

function drawGoalRing() {
  const cols = ['#ff5252', '#ff9800', '#ffeb3b', '#4caf50', '#2196f3', '#9c27b0'];
  const pulse = 1 + Math.sin(time * 3) * 0.04;
  ctx.save();
  ctx.translate(goal.x, goal.y);
  ctx.scale(pulse, pulse);
  ctx.globalAlpha = 0.9;
  cols.forEach((c, i) => {
    ctx.strokeStyle = c; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(0, 0, goal.r + 6 + i * 7, 0, Math.PI * 2); ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  // Schild
  ctx.fillStyle = '#fff';
  rr(goal.x - 70, goal.y - goal.r - 95, 140, 50, 14); ctx.fill();
  ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 4; ctx.stroke();
  text('ZIEL', goal.x, goal.y - goal.r - 69, 34, '#e53935', 'center', null);
  for (const p of players) if (p.done) {
    drawStar(goal.x + (p.id === 1 ? -95 : 95), goal.y - goal.r - 70, 18, p.color, time);
  }
}

function drawEdgeArrow(tx, ty, color, label) {
  if (onScreen(tx, ty, -40)) {
    // Ziel ist sichtbar: Hüpfpfeil darüber
    const bob = Math.sin(time * 6) * 8;
    const sx = tx - cam.x, sy = ty - cam.y - 70 + bob;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(sx - 16, sy - 20); ctx.lineTo(sx + 16, sy - 20); ctx.lineTo(sx, sy); ctx.fill();
    text(label, sx, sy - 40, 24, '#fff');
    return;
  }
  const cx = VW / 2, cy = VH / 2 + 40;
  const a = Math.atan2(ty - cam.y - cy, tx - cam.x - cx);
  const ex = clamp(cx + Math.cos(a) * 1000, 60, VW - 60);
  const ey = clamp(cy + Math.sin(a) * 1000, 150, VH - 60);
  const pul = 1 + Math.sin(time * 6) * 0.12;
  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(a);
  ctx.scale(pul, pul);
  ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(-14, -22); ctx.lineTo(-6, 0); ctx.lineTo(-14, 22); ctx.closePath();
  ctx.stroke(); ctx.fill();
  ctx.restore();
  text(label, clamp(ex - Math.cos(a) * 70, 90, VW - 90), clamp(ey - Math.sin(a) * 45, 140, VH - 30), 22, '#fff');
}

function drawWorld() {
  ctx.save();
  const sh = shake > 0 ? 6 * shake / 0.25 : 0;
  ctx.translate(-cam.x + rand(-sh, sh), -cam.y + rand(-sh, sh));
  drawGround();
  drawGoalGround();
  // Schatten der fliegenden Jets
  for (const p of players) if (p.mode === 'jet') {
    const o = 15 + p.alt * 45;
    ellipse(p.x + o * 0.5, p.y + o, 42, 16, 'rgba(0,0,0,.18)');
  }
  // nach Tiefe sortiert zeichnen
  const list = [];
  for (const t of trees) if (t.alive && onScreen(t.x, t.y, 160)) list.push({ y: t.y, f: () => t.evil ? drawEvilTree(t) : drawNiceTree(t) });
  for (const p of players) if (p.mode === 'foot') list.push({ y: p.y, f: () => drawPerson(p) });
  for (const j of parked) list.push({
    y: j.y, f: () => {
      ellipse(j.x + 6, j.y + 18, 40, 12, 'rgba(0,0,0,.25)');
      const pop = Math.min(1, j.t * 3);
      drawJet(j.x, j.y, 0, j.owner, 0.85 * pop, false);
    }
  });
  list.sort((a, b) => a.y - b.y);
  for (const e of list) e.f();
  for (const p of players) if (p.mode === 'foot') drawMouth(p);
  // Matschkugeln
  for (const m of muds) {
    ellipse(m.x, m.y + 20, 8, 3, 'rgba(0,0,0,.2)');
    circle(m.x, m.y, 9, '#6d4c2f');
    circle(m.x - 3, m.y - 3, 3, '#8d6e4f');
  }
  // Luftebene
  drawGoalRing();
  for (const r of rockets) {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(Math.atan2(r.vy, r.vx));
    ctx.fillStyle = '#fff'; rr(-10, -4, 20, 8, 4); ctx.fill();
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.moveTo(10, -4); ctx.lineTo(17, 0); ctx.lineTo(10, 4); ctx.fill();
    ctx.fillRect(-10, -7, 5, 14);
    ctx.restore();
  }
  for (const p of players) if (p.mode === 'jet') {
    const sc = 0.85 + 0.15 * p.alt;
    drawJet(p.x, p.y - p.alt * 10, p.angle, p, sc, true);
    // Nummer über dem Jet
    ctx.fillStyle = '#fff'; ctx.strokeStyle = p.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y - 62, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    text(String(p.id), p.x, p.y - 61, 16, p.color, 'center', null);
  }
  // Partikel
  for (const q of particles) {
    ctx.globalAlpha = Math.min(1, q.life / q.max * 1.5);
    if (q.type === 'star') drawStar(q.x, q.y, q.s * 1.4, q.c, q.rot);
    else if (q.type === 'heart') drawHeart(q.x, q.y, q.s / 5, q.c);
    else circle(q.x, q.y, q.s, q.c);
  }
  ctx.globalAlpha = 1;
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    text(f.str, f.x, f.y, f.size, f.color);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawKey(x, y, label, w = 44) {
  ctx.fillStyle = '#f5f5f5';
  rr(x - w / 2, y - 22, w, 44, 9); ctx.fill();
  ctx.strokeStyle = '#999'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#ddd'; rr(x - w / 2 + 3, y + 12, w - 6, 7, 4); ctx.fill();
  text(label, x, y - 2, 22, '#333', 'center', null);
}
function drawKeySet(cx, cy, p) {
  const L = p.id === 1 ? ['W', 'A', 'S', 'D'] : ['▲', '◀', '▼', '▶'];
  drawKey(cx, cy - 25, L[0]);
  drawKey(cx - 48, cy + 23, L[1]);
  drawKey(cx, cy + 23, L[2]);
  drawKey(cx + 48, cy + 23, L[3]);
}

function miniEvil(x, y, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = filled ? '#55306f' : 'rgba(255,255,255,.25)';
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6, r = i % 2 ? 9 : 13;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  if (filled) {
    circle(-4, -1, 2.5, '#ffd54f'); circle(4, -1, 2.5, '#ffd54f');
    ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, 2); ctx.lineTo(-2, 9); ctx.lineTo(10, -7); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  // Spielerkarten
  for (const p of players) {
    const left = p.id === 1;
    const x = left ? 14 : VW - 14 - 250;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    rr(x, 12, 250, 74, 16); ctx.fill();
    ctx.strokeStyle = p.color; ctx.lineWidth = 4; ctx.stroke();
    circle(x + 36, 49, 24, p.color);
    text(String(p.id), x + 36, 50, 30, '#fff', 'center', null);
    text(p.name, x + 70, 34, 22, '#fff', 'left');
    text(left ? 'W A S D' : 'Pfeiltasten', x + 70, 64, 18, '#ddd', 'left');
    // Status-Symbol
    const sx = x + 215, sy = 49;
    if (p.done) drawStar(sx, sy, 20, '#ffeb3b', time);
    else if (p.mode === 'jet') drawJet(sx, sy, -0.4, p, 0.42, false);
    else if (p.mouth) {
      ctx.save(); ctx.translate(sx, sy); ctx.scale(1.1, 1.1);
      circle(0, 0, 15, '#ffd23f');
      ellipse(4, 4, 8, 5, '#b3123b');
      circle(-3, -6, 4, '#fff'); circle(7, -6, 4, '#fff');
      circle(-2, -6, 2, '#222'); circle(8, -6, 2, '#222');
      ctx.restore();
    } else drawJet(sx, sy, -0.4, p, 0.42, false);
  }
  // Fortschritt in der Mitte
  const cx = VW / 2;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  rr(cx - 235, 12, 470, 74, 16); ctx.fill();
  if (jetsGiven < 2 || team < T2) {
    const base = team < T1 ? 0 : T1;
    const goalN = team < T1 ? T1 : T2;
    text(team < T1 ? 'Bis zum 1. Jet:' : 'Bis zum 2. Jet:', cx - 120, 32, 18, '#fff');
    for (let i = 0; i < goalN - base; i++) miniEvil(cx - 195 + i * 40, 62, team - base > i);
    // Pfeil + Jet
    text('➜', cx + 22, 62, 26, '#fff', 'center', null);
    drawJet(cx + 90, 56, 0, team < T1 ? { color: '#ffd23f', dark: '#c99400', id: 0, hair: '#000' } : players.find(p => p.mouth) || players[1], 0.55, false);
    text(`${team}`, cx + 185, 50, 34, '#ffe14d');
    text('Bäume', cx + 185, 74, 14, '#fff', 'center', null);
  } else {
    text('Fliegt beide ins', cx - 40, 49, 26, '#fff');
    text('ZIEL!', cx + 140, 49, 34, '#ff5252', 'center', '#fff', 5);
  }

  // Hinweise / Pfeile
  for (const j of parked) drawEdgeArrow(j.x, j.y - 30, j.owner.color, 'Einsteigen!');
  const anyJet = players.some(p => p.mode === 'jet' && !p.done);
  if (anyJet) drawEdgeArrow(goal.x, goal.y - goal.r - 100, '#ff5252', 'Ziel');
  if (team < T2 || jetsGiven < 2) {
    const visible = trees.some(t => t.alive && t.evil && onScreen(t.x, t.y, -30));
    if (!visible) {
      const mx = (players[0].x + players[1].x) / 2, my = (players[0].y + players[1].y) / 2;
      let best = null, bd = 1e9;
      for (const t of trees) if (t.alive && t.evil) { const d = dist(mx, my, t.x, t.y); if (d < bd) { bd = d; best = t; } }
      if (best) drawEdgeArrow(best.x, best.y - 60, '#7b4f9d', 'Böser Baum!');
    }
  }

  // Banner
  if (banner) {
    const a = Math.min(1, banner.life * 2, (banner.max - banner.life) * 4);
    ctx.globalAlpha = a;
    ctx.font = `bold 30px ${FONT}`;
    const w = Math.min(VW - 60, ctx.measureText(banner.str).width + 60);
    ctx.fillStyle = 'rgba(30,20,50,.8)';
    rr(VW / 2 - w / 2, VH - 92, w, 64, 20); ctx.fill();
    text(banner.str, VW / 2, VH - 60, 30, banner.color);
    ctx.globalAlpha = 1;
  }
  if (muted) text('Ton aus (M)', VW - 20, VH - 20, 16, '#fff', 'right');
}

function drawTitle() {
  ctx.fillStyle = 'rgba(10,30,15,.6)';
  ctx.fillRect(0, 0, VW, VH);
  const bob = Math.sin(time * 2) * 6;
  text('Baumspiel', VW / 2, 82 + bob, 84, '#ffe14d', 'center', '#3e2453', 14);
  text('Fressmaul & Jet', VW / 2, 152, 38, '#fff', 'center', '#3e2453', 8);

  // Spieler-Erklärung
  for (const p of players) {
    const cx = p.id === 1 ? 250 : VW - 250;
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    rr(cx - 150, 200, 300, 270, 24); ctx.fill();
    ctx.strokeStyle = p.color; ctx.lineWidth = 5; ctx.stroke();
    text(p.name, cx, 232, 30, '#fff');
    const fake = Object.assign({}, p, { x: cx - 30, y: 345, moving: true, walkT: time * 8, dir: { x: 1, y: 0 }, dizzy: 0 });
    drawPerson(fake);
    drawMouth(Object.assign({}, fake, { mouth: { x: cx + 25, y: 315, state: 'normal', t: 0 } }));
    drawKeySet(cx, 410, p);
  }
  // Regeln in der Mitte mit Bildern
  const rx = VW / 2;
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  rr(rx - 210, 200, 420, 270, 24); ctx.fill();
  const rows = [
    ['Friss die bösen Bäume!', () => drawEvilTree({ x: rx - 160, y: 280, size: 0.42, phase: 0, eater: null, throwT: 0 })],
    ['Die lieben Bäume nicht!', () => drawNiceTree({ x: rx - 160, y: 360, size: 0.4, phase: 1, happy: 0, shade: 0, fruit: true })],
    ['Hol dir einen Jet!', () => drawJet(rx - 160, 400, -0.3, players[0], 0.55, true)],
    ['Fliegt beide ins ZIEL!', () => { ctx.save(); ctx.translate(rx - 160, 445); ['#ff5252', '#ffeb3b', '#4caf50', '#2196f3'].forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 10 + i * 3, 0, Math.PI * 2); ctx.stroke(); }); ctx.restore(); }]
  ];
  rows.forEach(([s, f], i) => {
    f();
    text(s, rx - 110, 245 + i * 66, 25, '#fff', 'left');
  });
  // Start
  const pul = 1 + Math.sin(time * 4) * 0.05;
  ctx.save();
  ctx.translate(VW / 2, 560);
  ctx.scale(pul, pul);
  ctx.fillStyle = '#4caf50';
  rr(-260, -40, 520, 80, 40); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke();
  text('LEERTASTE = Los geht\'s!', 0, 0, 36, '#fff', 'center', '#1b5e20', 7);
  ctx.restore();
  text('Esc = Pause    M = Ton an/aus', VW / 2, 650, 20, '#ddd');
}

function drawWin() {
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(0, 0, VW, VH);
  const bob = Math.sin(time * 3) * 8;
  text('SUPER!', VW / 2, 200 + bob, 110, '#ffe14d', 'center', '#e53935', 16);
  text(`Ihr habt Level ${level} geschafft!`, VW / 2, 300, 44, '#fff', 'center', '#1a237e', 9);
  for (let i = 0; i < 5; i++) drawStar(VW / 2 - 160 + i * 80, 380, 28, '#ffeb3b', time + i);
  if (stateT > 1.5) {
    const pul = 1 + Math.sin(time * 4) * 0.05;
    ctx.save();
    ctx.translate(VW / 2, 480);
    ctx.scale(pul, pul);
    ctx.fillStyle = '#4caf50';
    rr(-270, -40, 540, 80, 40); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke();
    text('LEERTASTE = Nächstes Level', 0, 0, 34, '#fff', 'center', '#1b5e20', 7);
    ctx.restore();
  }
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fillRect(0, 0, VW, VH);
  text('Pause', VW / 2, VH / 2 - 30, 90, '#fff');
  text('Drücke LEERTASTE zum Weiterspielen', VW / 2, VH / 2 + 50, 30, '#ffe14d');
}

// ---------------- Hauptschleife ----------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  time += dt;
  stateT += dt;

  if (state === 'play') { update(dt); updateEffects(dt); }
  else if (state === 'win') { updateWin(dt); updateEffects(dt); }
  else if (state === 'title') {
    cam.x = (Math.sin(time * 0.1) * 0.5 + 0.5) * Math.min(1400, W - VW);
    cam.y = clamp(H / 2 - VH / 2, 0, H - VH);
    updateEffects(dt);
  }

  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1d3b1f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();

  drawWorld();
  if (state === 'play' || state === 'pause') drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'pause') drawPause();
  if (state === 'win') drawWin();

  ctx.restore();
  requestAnimationFrame(frame);
}

makeLevel(1);
requestAnimationFrame(frame);
</script>
